<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Qube Cut</title>
<style>
  :root {
    --bg: #17171c;
    --panel: #1f1f27;
    --panel-2: #262631;
    --border: #33333f;
    --text: #e9e9ee;
    --text-dim: #9a9aa8;
    --accent: #6c5ce7;
    --accent-2: #00d2a0;
    --danger: #ff5d6c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  header {
    padding: 10px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-shrink: 0;
  }
  header .logo {
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.3px;
  }
  header .logo span { color: var(--accent-2); }
  header .spacer { flex: 1; }
  button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    font-weight: 600;
  }
  button.primary:hover { filter: brightness(1.08); }
  button:disabled { opacity: 0.45; cursor: default; }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: 260px 1fr 300px;
    min-height: 0;
  }

  #library {
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 14px;
    overflow-y: auto;
  }
  #library h3, #settings h3 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; color: var(--text-dim); letter-spacing: 0.6px; }
  .clip-item {
    padding: 8px 10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
    font-size: 12px;
    cursor: pointer;
    word-break: break-all;
  }
  .clip-item:hover { border-color: var(--accent); }
  #dropzone {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 22px 10px;
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    margin-bottom: 14px;
    cursor: pointer;
  }
  #dropzone:hover { border-color: var(--accent); color: var(--text); }
  #dropzone.dragover { border-color: var(--accent-2); color: var(--accent-2); }

  #preview-area {
    display: flex;
    flex-direction: column;
    padding: 14px;
    min-height: 0;
  }
  #video-wrap {
    flex: 1;
    background: #000;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    overflow: hidden;
  }
  video { max-width: 100%; max-height: 100%; }
  #placeholder { color: var(--text-dim); font-size: 13px; text-align: center; padding: 20px; }

  #trim-controls {
    margin-top: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  #trim-controls .row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 12px; }
  #trim-controls label { width: 80px; color: var(--text-dim); }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  .time-badge { font-variant-numeric: tabular-nums; color: var(--accent-2); width: 60px; text-align: right; }
  .hint { font-size: 11px; color: var(--text-dim); }
  .hint b { color: var(--text); }
  #cut-strip-wrap { margin: 10px 0; }
  #cut-strip {
    position: relative;
    height: 46px;
    display: flex;
    gap: 2px;
    background: #101014;
    border-radius: 8px;
    padding: 2px;
    cursor: pointer;
  }
  .seg-block {
    height: 100%;
    background: linear-gradient(180deg, #3a3a4a, #2c2c38);
    border: 1px solid var(--border);
    border-radius: 4px;
    position: relative;
    min-width: 4px;
  }
  .seg-block.selected {
    border-color: var(--accent-2);
    background: linear-gradient(180deg, #35485a, #24343f);
  }
  #playhead {
    position: absolute;
    top: -3px;
    bottom: -3px;
    width: 2px;
    background: var(--accent-2);
    left: 0;
    pointer-events: none;
    box-shadow: 0 0 6px var(--accent-2);
  }

  #timeline-panel {
    margin-top: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    min-height: 90px;
  }
  #timeline-panel h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; color: var(--text-dim); }
  #timeline-track { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .timeline-clip {
    flex-shrink: 0;
    width: 110px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    font-size: 11px;
    position: relative;
  }
  .timeline-clip.selected { border-color: var(--accent-2); }
  .timeline-clip .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
  .timeline-clip .dur { color: var(--text-dim); }
  .timeline-clip .remove {
    position: absolute; top: 4px; right: 4px;
    background: var(--danger); color: #fff; border: none;
    border-radius: 50%; width: 16px; height: 16px; font-size: 10px;
    line-height: 16px; text-align: center; padding: 0; cursor: pointer;
  }
  #empty-timeline { color: var(--text-dim); font-size: 12px; }

  #settings {
    background: var(--panel);
    border-left: 1px solid var(--border);
    padding: 14px;
    overflow-y: auto;
  }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  select {
    width: 100%;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    font-size: 13px;
  }
  #export-btn { width: 100%; padding: 12px; font-size: 14px; margin-top: 6px; }
  #progress-wrap { margin-top: 14px; display: none; }
  #progress-bar-bg { background: var(--panel-2); border-radius: 6px; height: 8px; overflow: hidden; }
  #progress-bar { background: linear-gradient(90deg, var(--accent), var(--accent-2)); height: 100%; width: 0%; transition: width 0.2s; }
  #progress-label { font-size: 11px; color: var(--text-dim); margin-top: 6px; }
  #result-msg { margin-top: 10px; font-size: 12px; padding: 8px; border-radius: 8px; display: none; }
  #result-msg.ok { background: rgba(0,210,160,0.12); color: var(--accent-2); display: block; }
  #result-msg.err { background: rgba(255,93,108,0.12); color: var(--danger); display: block; }
</style>
</head>
<body>

<header>
  <div class="logo">Qube <span>Cut</span></div>
  <div class="spacer"></div>
  <button id="add-files-btn">+ Import Video</button>
</header>

<main>
  <div id="library">
    <h3>Media</h3>
    <div id="dropzone">Drag & drop videos here<br/>or click Import</div>
    <div id="clip-list"></div>
  </div>

  <div id="preview-area">
    <div id="video-wrap">
      <div id="placeholder">Import a video to get started</div>
      <video id="player" controls style="display:none;"></video>
    </div>

    <div id="trim-controls">
      <div class="row" style="justify-content: space-between;">
        <div class="hint">
          <b>S</b> split at playhead &nbsp;·&nbsp; <b>X</b> delete selected &nbsp;·&nbsp;
          <b>Ctrl+Z</b> undo &nbsp;·&nbsp; <b>Ctrl+Y</b> redo &nbsp;·&nbsp; <b>Space</b> play/pause
        </div>
        <div style="display:flex; gap:6px;">
          <button id="undo-btn" disabled title="Undo (Ctrl+Z)">↶ Undo</button>
          <button id="redo-btn" disabled title="Redo (Ctrl+Y)">↷ Redo</button>
        </div>
      </div>
      <div id="cut-strip-wrap">
        <div id="cut-strip"><div id="playhead"></div></div>
      </div>
      <div class="row" style="justify-content: flex-end; gap: 8px;">
        <button id="split-btn" disabled>Split (S)</button>
        <button id="delete-btn" disabled>Delete selected (X)</button>
        <button id="add-to-timeline-btn" disabled>Add kept parts to project →</button>
      </div>
    </div>

    <div id="timeline-panel">
      <h3>Timeline (plays in order)</h3>
      <div id="timeline-track">
        <div id="empty-timeline">No clips added yet.</div>
      </div>
    </div>
  </div>

  <div id="settings">
    <h3>Export Settings</h3>
    <div class="field">
      <label>Resolution</label>
      <select id="resolution-select">
        <option value="1280x720">720p (1280×720)</option>
        <option value="1920x1080">1080p Full HD (1920×1080)</option>
        <option value="2560x1440" selected>2K / QHD (2560×1440)</option>
        <option value="3840x2160">4K / UHD (3840×2160)</option>
      </select>
    </div>
    <div class="field">
      <label>Frame Rate</label>
      <select id="fps-select">
        <option value="30" selected>30 fps</option>
        <option value="60">60 fps</option>
        <option value="90">90 fps</option>
        <option value="120">120 fps</option>
        <option value="144">144 fps</option>
      </select>
    </div>
    <button id="export-btn" class="primary" disabled>Export Video</button>

    <div id="progress-wrap">
      <div id="progress-bar-bg"><div id="progress-bar"></div></div>
      <div id="progress-label">Starting…</div>
    </div>
    <div id="result-msg"></div>
  </div>
</main>

<script src="renderer.js"></script>
</body>
</html>
